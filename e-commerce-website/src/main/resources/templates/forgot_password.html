<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::layout(~{::section})}">
<head>
  <meta charset="UTF-8">
  <title>Forgot Password</title>
</head>
<body>
<section>
  <div class="container mt-5 p-5">
    <div class="row">
      <div class="col-md-6 p-5">
        <img alt="" src="img/ecom.png" width="100%" height="400px">
      </div>
      <div class="col-md-6 mt-3 p-5">
        <div class="card shadow p-3 mb-5 bg-body-tertiary rounded">
          <div class="card-header">
            <p class="fs-4 text-center">Forgot Password</p>

            <div th:if="${session.errorMsg}">
              <p class="text-danger fw-bold text-center" th:text="${session.errorMsg}"></p>
            </div>

            <div th:if="${session.succMsg}">
              <p class="text-success fw-bold text-center" th:text="${session.succMsg}"></p>
            </div>

          </div>
          <div th:if="${session.userValid == null || !session.userValid}">
            <div class="card-body">
              <form action="/forgot-password" method="post">
                <div class="mb-3">
                  <label class="form-label">Email</label>
                  <input class="form-control" name="email" type="email" placeholder="Enter your email" required>
                </div>
                <div class="text-center">
                  <button type="submit" class="btn bg-primary text-white">Send</button>
                </div>
              </form>
            </div>
          </div>
          <div th:if="${session.userValid}">
            <div class="card-body">
              <form action="/reset-password" method="POST">
                <input type="hidden" id="userId" name="userId" th:value="${session.validUserDetail.email}">
                <div class="mb-3">
                  <label class="form-label">Password</label>
                  <input class="form-control" name="password" type="password" required>
                </div>
                <div class="text-center">
                  <button type="submit" class="btn bg-primary text-white">Reset Password</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
</body>
</html>
