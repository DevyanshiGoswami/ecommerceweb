<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Order Status</title>
</head>
<body>
<h1>Order Status</h1>
<ul th:if="${not #lists.isEmpty(orders)}">
    <li th:each="order : ${orders}">
        <p>Order ID: <span th:text="[[${order.id}]]">order id</span></p>
        <p>Status: <span th:text="[[${order.status}]]">status</span></p>
    </li>
</ul>
<p th:if="${#lists.isEmpty(orders)}">No orders found.</p>
</body>
</html>
